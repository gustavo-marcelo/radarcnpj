spring.application.name=cnpj

spring.datasource.url=jdbc:postgresql://localhost:5432/cnpj?currentSchema=public
spring.datasource.username=cnpj
spring.datasource.password=cnpj

spring.lifecycle.timeout-per-shutdown-phase=30s

# Banco já existia com dados (importados por CLI); Flyway faz baseline e só cria o que falta.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.default-schema=public

# --- Importacao (fallback quando a tabela configuracao_importacao nao tem registro) ---
app.dados.dir=../dados
app.import.enabled=false
app.import.truncate-before=true
app.import.database=cnpj
app.import.threads=4

# --- Autenticacao ---
app.cadastro-publico=false
app.admin.email=admin@exemplo.com
app.admin.senha=admin123
app.jwt.secret=cnpj-gerencie-a-mudanca-deste-segredo-em-variavel-de-ambiente-2026-chave-256-bits-minima
app.jwt.expiration-seconds=86400

# --- CORS (origens permitidas, separadas por virgula; dev usa proxy) ---
app.cors.origens=https://front-dev.espalha.ai,http://localhost:4200,http://127.0.0.1:4200

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info