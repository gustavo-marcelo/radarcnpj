<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-sm rounded-lg bg-white p-8 shadow">
    <span class="mb-1 text-center text-2xl font-semibold text-slate-800">
      <img src="images/logo-texto.png" alt="Radar CNPJ" class="h-10 w-auto m-auto" />
    </span>
    <p class="mb-6 text-center text-sm text-slate-500">Acesse com sua conta</p>

    @if (erro()) {
      <div class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ erro() }}
      </div>
    }

    <form class="space-y-4" (ngSubmit)="entrar()">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-slate-700">E-mail</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          [(ngModel)]="email"
          name="email"
          class="w-full rounded border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none"
        />
      </div>

      <div>
        <label for="senha" class="mb-1 block text-sm font-medium text-slate-700">Senha</label>
        <input
          id="senha"
          type="password"
          autocomplete="current-password"
          required
          [(ngModel)]="senha"
          name="senha"
          class="w-full rounded border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none"
        />
      </div>

      <button
        type="submit"
        [disabled]="carregando()"
        class="w-full rounded bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ carregando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-slate-500">
      Não tem conta?
      <a routerLink="/cadastro" class="font-medium text-indigo-600 hover:underline">Cadastre-se</a>
    </p>
  </div>
</div>
